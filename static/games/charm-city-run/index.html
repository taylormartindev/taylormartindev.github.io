<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Charm City Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b18; overflow: hidden; }
    body {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* #app is sized (and, for forced landscape, rotated) by the layout code in src/touch.js */
    #app {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; transform-origin: 0 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-sizing: border-box;
    }
    #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; flex: none; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; }
    canvas:focus { outline: none; }

    /* ---------- touch controls (only shown on touch devices) ---------- */
    #touch { display: none; }
    #touch.on { display: flex; }
    .group { display: flex; gap: 10px; align-items: flex-end; }
    .tbtn {
      font-family: "Press Start 2P", ui-monospace, monospace; font-size: 10px; color: #fff;
      width: 64px; height: 64px; border-radius: 50%; padding: 0;
      background: rgba(10, 10, 25, 0.55); border: 2px solid #f6c33b;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    .tbtn.big { width: 80px; height: 80px; font-size: 11px; }
    .tbtn.small { width: auto; height: 36px; border-radius: 18px; padding: 0 12px; font-size: 9px; border-color: #9adfff; }
    .tbtn.down { background: rgba(246, 195, 59, 0.6); color: #111; }

    /* portrait: game on top, controls in the space below */
    body.port #app { justify-content: flex-start; padding-top: max(12px, env(safe-area-inset-top)); }
    body.port #touch.on {
      flex: 1; width: 100%; box-sizing: border-box; padding: 16px 14px max(24px, env(safe-area-inset-bottom));
      justify-content: space-between; align-items: center; gap: 8px;
    }
    body.port .group { align-items: center; }
    body.port .group.mid { flex-direction: column; gap: 10px; }
    body.port .tbtn { width: 72px; height: 72px; }
    body.port .tbtn.big { width: 92px; height: 92px; }
    body.port .tbtn.small { width: auto; height: 40px; }

    /* landscape (real or forced): translucent buttons over the bottom corners of the game */
    body.land #touch.on {
      position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
      justify-content: space-between; align-items: flex-end;
      padding: 0 max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }
    body.land #touch.on .tbtn { pointer-events: auto; opacity: 0.85; }
    body.land .group.mid { flex-direction: column; gap: 8px; align-items: center; }

    #toast {
      position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 80%;
      font-family: "Press Start 2P", ui-monospace, monospace; font-size: 11px; line-height: 1.6; color: #fff; text-align: center;
      background: rgba(10, 10, 25, 0.92); border: 2px solid #f6c33b; padding: 14px 16px; border-radius: 6px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 10;
    }
    #toast.show { opacity: 1; }
    #code-input {
      position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0;
      font-size: 16px; border: 0; padding: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="960" height="540"></canvas>
    </div>
    <div id="touch">
      <div class="group left"></div>
      <div class="group mid"></div>
      <div class="group right"></div>
    </div>
    <div id="toast"></div>
  </div>
  <input id="code-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="16" aria-label="Enter code">
  <script type="module" src="src/main.js"></script>
</body>
</html>
